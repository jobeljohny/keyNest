@if (variant() === 'action') {
  <button
    type="button"
    class="menu__trigger-action"
    [class.menu__trigger-action--on]="open()"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [title]="label()"
    (click)="toggle($event)"
  >
    @if (triggerIcon()) {
      <svg [lucideIcon]="triggerIcon()" [size]="16" aria-hidden="true"></svg>
    }
    <span>{{ triggerLabel() }}</span>
  </button>
} @else {
  <button
    type="button"
    class="icon-btn icon-btn--sm menu__trigger"
    [class.menu__trigger--on]="open()"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [title]="label()"
    (click)="toggle($event)"
  >
    <svg lucideIcon="ellipsis-vertical" [size]="16" aria-hidden="true"></svg>
  </button>
}

@if (open()) {
  <div class="menu__panel" [class.menu__panel--start]="panelAlign() === 'start'" role="menu">
    @for (item of items(); track item.id) {
      <button
        type="button"
        class="menu__item"
        [class.menu__item--danger]="item.danger"
        [disabled]="item.disabled"
        role="menuitem"
        (click)="onItemClick(item, $event)"
      >
        @if (item.icon) {
          <svg class="menu__item-icon" [lucideIcon]="item.icon" [size]="16" aria-hidden="true"></svg>
        }
        <span>{{ item.label }}</span>
      </button>
    }
  </div>
}
