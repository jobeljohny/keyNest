<article
  class="card"
  [class.card--selected]="selected()"
  [class.card--selection-active]="selectionActive()"
>
  <button
    type="button"
    class="card__select"
    [class.card__select--on]="selected()"
    [attr.aria-pressed]="selected()"
    [attr.aria-label]="(selected() ? 'Deselect ' : 'Select ') + credential().name"
    [attr.title]="selected() ? 'Deselect' : 'Select'"
    (click)="onToggleSelect()"
  >
    @if (selected()) {
      <svg lucideIcon="check" [size]="14" [strokeWidth]="3" aria-hidden="true"></svg>
    }
  </button>

  <header class="card__head">
    <div class="card__avatar" aria-hidden="true">{{ credential().name.charAt(0).toUpperCase() }}</div>
    <div class="card__id">
      <h3 class="card__name">{{ credential().name }}</h3>
      <p class="card__user">{{ credential().username }}</p>
    </div>
    @if (!selected()) {
      <app-context-menu
        class="card__menu"
        [items]="menuItems"
        [label]="'Options for ' + credential().name"
        (select)="onMenuSelect($event)"
        (openChange)="menuOpen.set($event)"
      />
    }
  </header>

  <div class="card__pw">
    <span class="card__pw-value mono">
      {{ revealed() ? credential().password : maskedPassword() }}
    </span>
    <button
      type="button"
      class="icon-btn icon-btn--sm card__reveal"
      [class.card__reveal--on]="revealed()"
      [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
      (click)="toggleReveal()"
    >
      @if (revealed()) {
        <svg lucideIcon="eye-off" [size]="16" aria-hidden="true"></svg>
      } @else {
        <svg lucideIcon="eye" [size]="16" aria-hidden="true"></svg>
      }
    </button>
  </div>

  @if (confirmingDelete()) {
    <div class="card__confirm">
      <span>Delete this credential?</span>
      <div class="card__confirm-actions">
        <button type="button" class="btn btn--ghost btn--sm" (click)="cancelDelete()">Cancel</button>
        <button type="button" class="btn btn--danger btn--sm" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  } @else {
    <footer class="card__actions">
      <button type="button" class="action" (click)="copy('username')" aria-label="Copy username" title="Copy username">
        <svg lucideIcon="copy" [size]="16" aria-hidden="true"></svg>
        <span>User</span>
      </button>
      <button type="button" class="action" (click)="copy('password')" aria-label="Copy password" title="Copy password">
        <svg lucideIcon="lock" [size]="16" aria-hidden="true"></svg>
        <span>Pass</span>
      </button>
      <app-context-menu
        variant="action"
        [items]="shareMenuItems"
        [triggerIcon]="shareIconName"
        triggerLabel="Share"
        [label]="'Share ' + credential().name"
        align="end"
        (select)="onShareSelect($event)"
        (openChange)="menuOpen.set($event)"
      />
    </footer>
  }
</article>
