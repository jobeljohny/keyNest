<div class="empty">
  <div class="empty__icon" aria-hidden="true">{{ icon() }}</div>
  <h2 class="empty__title">{{ title() }}</h2>
  @if (body()) {
    <p class="empty__body">{{ body() }}</p>
  }
  @if (actionLabel(); as label) {
    <button type="button" class="btn btn--primary" (click)="action.emit()">
      <svg lucideIcon="plus" [size]="18" [strokeWidth]="2.2" aria-hidden="true"></svg>
      <span>{{ label }}</span>
    </button>
  }
</div>
