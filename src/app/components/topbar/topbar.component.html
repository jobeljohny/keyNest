<header class="topbar">
  <div class="brand">
    <img class="brand__logo" src="keynest-logo.png" alt="KeyNest — local first vault" />
  </div>

  <div class="topbar__actions">
    <button type="button" class="btn btn--ghost" (click)="triggerImport()">
      <svg lucideIcon="download" [size]="16" aria-hidden="true"></svg>
      <span class="btn__label">Import</span>
    </button>
    <button type="button" class="btn btn--ghost" (click)="export.emit()">
      <svg lucideIcon="upload" [size]="16" aria-hidden="true"></svg>
      <span class="btn__label">Export</span>
    </button>
    <input
      #importInput
      type="file"
      accept="application/json,.json"
      class="visually-hidden"
      (change)="onFileChosen($event)"
    />
  </div>
</header>
