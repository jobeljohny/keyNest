<section class="toolbar">
  <div class="search">
    <span class="search__icon" aria-hidden="true">
      <svg lucideIcon="search" [size]="18"></svg>
    </span>
    <input
      class="search__input"
      type="search"
      placeholder="Search by name or username…"
      [value]="query()"
      (input)="onInput($event)"
      aria-label="Search credentials"
    />
  </div>
  <button type="button" class="btn btn--primary toolbar__add" (click)="add.emit()">
    <svg lucideIcon="plus" [size]="18" [strokeWidth]="2.2" aria-hidden="true"></svg>
    <span>Add credential</span>
  </button>
</section>
